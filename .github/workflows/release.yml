name: Release

# Push a tag like v1.2.0 and this builds, packages, and publishes the release.
# The tag is the single source of truth for the version — project.yml's
# MARKETING_VERSION is overridden at build time, so it can never drift again.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # The app uses Liquid Glass (macOS 26 SDK APIs behind #available), so it needs
    # Xcode 26+. macos-15 defaults to Xcode 16.4; macos-26 (arm64) defaults to 26.x.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: the build number is the commit count

      - name: Select newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          SDK=$(xcrun --sdk macosx --show-sdk-version)
          echo "macOS SDK $SDK"
          if [ "${SDK%%.*}" -lt 26 ]; then
            echo "::error::macOS $SDK SDK — Liquid Glass needs the macOS 26+ SDK"
            exit 1
          fi

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Ensure Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Generate project
        run: xcodegen generate

      - name: Build (version from tag)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Sparkle orders updates by CFBundleVersion — the commit count only ever
          # grows, and is always above local dev builds (project.yml says 1).
          BUILD=$(git rev-list --count HEAD)
          echo "version=$VERSION build=$BUILD"
          xcodebuild -project DotStudio.xcodeproj -scheme DotStudio -configuration Release \
            -derivedDataPath build/DD \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            build

      - name: Verify build
        run: |
          APP="build/DD/Build/Products/Release/DotStudio.app"
          test -d "$APP"
          BUILT=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")
          SAVER=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Resources/DotStudio.saver/Contents/Info.plist")
          echo "app=$BUILT saver=$SAVER tag=${GITHUB_REF_NAME#v}"
          test "$BUILT" = "${GITHUB_REF_NAME#v}"
          test "$SAVER" = "${GITHUB_REF_NAME#v}"
          codesign --verify --deep "$APP"

      - name: Sign with the stable release identity
        # A stable self-signed identity (scripts/setup-signing.sh) keeps macOS privacy grants —
        # e.g. Automation for Spotify/Music — across updates; ad-hoc signatures change every build.
        # The cert needn't be trusted for codesign, so no interactive trust step is required.
        env:
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$SIGNING_P12_BASE64" ] || [ -z "$SIGNING_P12_PASSWORD" ]; then
            echo "::error::SIGNING_P12_BASE64 / SIGNING_P12_PASSWORD not set — run scripts/setup-signing.sh once"
            exit 1
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"; KCPASS=$(openssl rand -hex 16)
          echo "$SIGNING_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$RUNNER_TEMP/id.p12" -k "$KC" -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPASS" "$KC" >/dev/null
          rm -f "$RUNNER_TEMP/id.p12"
          ID=$(security find-identity -p codesigning "$KC" | awk '/DotStudio Release Signing/{print $2; exit}')
          test -n "$ID"
          zsh scripts/sign-app.sh build/DD/Build/Products/Release/DotStudio.app "$ID" "$KC"
          security delete-keychain "$KC"

      - name: Package DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE=build/dmg-stage
          mkdir -p "$STAGE" dist
          cp -R build/DD/Build/Products/Release/DotStudio.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "DotStudio $VERSION" -srcfolder "$STAGE" -ov -format UDZO dist/DotStudio.dmg

      - name: Generate Sparkle appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY secret not set — without an appcast, installed apps can't auto-update to this release"
            exit 1
          fi
          SPARKLE_VERSION=2.9.4
          curl -sL -o sparkle.tar.xz "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir sparkle-tools && tar -xf sparkle.tar.xz -C sparkle-tools
          echo "$SPARKLE_ED_PRIVATE_KEY" | ./sparkle-tools/bin/generate_appcast --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            --link "https://github.com/${GITHUB_REPOSITORY}" \
            dist/
          test -f dist/appcast.xml

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS="dist/DotStudio.dmg"
          [ -f dist/appcast.xml ] && ASSETS="$ASSETS dist/appcast.xml"
          gh release create "$GITHUB_REF_NAME" $ASSETS \
            --title "DotStudio ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --notes "> **New install:** DotStudio isn't notarized. Drag it to Applications, open it once, then go to **System Settings → Privacy & Security** and click **Open Anyway**. Already installed? It updates itself — no download needed.
          $(awk "/^## ${GITHUB_REF_NAME#v}/{f=1;next} /^## /{f=0} f" CHANGELOG.md 2>/dev/null || true)"
