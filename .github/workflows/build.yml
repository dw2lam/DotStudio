name: Build

# A quick Debug build on every push to main, so SDK/toolchain problems show up long
# before a release tag does. Same runner + Xcode selection as release.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          SDK=$(xcrun --sdk macosx --show-sdk-version)
          echo "macOS SDK $SDK"
          if [ "${SDK%%.*}" -lt 26 ]; then
            echo "::error::macOS $SDK SDK — Liquid Glass needs the macOS 26+ SDK"
            exit 1
          fi

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Ensure Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Generate project
        run: xcodegen generate

      - name: Build (Debug)
        run: |
          xcodebuild -project DotStudio.xcodeproj -scheme DotStudio -configuration Debug \
            -derivedDataPath build/DD build

      - name: Set up Python (dmgbuild)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package an unsigned DMG
        # The same disk-image path release.yml takes (scripts/make-dmg.sh + the pinned dmgbuild
        # in scripts/dmg/requirements.txt), so a broken DMG shows up before a tag does. Not
        # uploaded; the release asset is still built only by release.yml.
        run: |
          python -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet --disable-pip-version-check -r scripts/dmg/requirements.txt
          DMGBUILD="$RUNNER_TEMP/dmgbuild/bin/dmgbuild" \
            zsh scripts/make-dmg.sh build/DD/Build/Products/Debug/DotStudio.app "0.0.0-ci" "$RUNNER_TEMP/DotStudio.dmg"
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -noautoopen -readonly -mountpoint "$MNT" "$RUNNER_TEMP/DotStudio.dmg"
          test -d "$MNT/DotStudio.app" && test -f "$MNT/How to Install.txt" && test -L "$MNT/Applications"
          hdiutil detach "$MNT"
