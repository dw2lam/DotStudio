name: DotStudio
options:
  bundleIdPrefix: com.davidlam
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    ENABLE_HARDENED_RUNTIME: "NO"
    MARKETING_VERSION: "1.5.0"
    # Local/dev builds are build 1 so any published release counts as newer.
    # CI stamps the real build number (git commit count) — see release.yml.
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    MTL_FAST_MATH: "YES"

targets:
  DotStudioSaver:
    type: bundle
    platform: macOS
    sources:
      - Saver
      - path: Shared
        # Shared/AI: the AI bridge and edits — app and dotstudio-mcp only.
        excludes: ["Photos/**", "Engines/**", "AI/**", "Films/**"]
      # Built-in film scenes (packages of looping clips rendered in Blender, CustomScenes
      # builtInPackagesDirs) ship ONCE too, inside the saver (Resources/Films).
      - path: Shared/Films
        type: folder
        buildPhase: resources
      # Built-in slideshow photos ship ONCE, inside the saver (Resources/Photos). The app
      # reads them from its embedded DotStudio.saver (CollectionSource.builtInPhotoURLs).
      - path: Shared/Photos
        type: folder
        buildPhase: resources
      # Custom Scene engines (data: Metal headers, wrappers, guides, examples — CustomScenes.swift),
      # Resources/Engines in the saver and the app alike: each compiles its packages at runtime.
      - path: Shared/Engines
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: DotStudio
        PRODUCT_MODULE_NAME: DotStudioSaver
        PRODUCT_BUNDLE_IDENTIFIER: com.davidlam.DotStudio.Saver
        WRAPPER_EXTENSION: saver
        INFOPLIST_FILE: Saver/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_OBJC_BRIDGING_HEADER: Shared/Bridging.h
        SKIP_INSTALL: "YES"

  DotStudio:
    type: application
    platform: macOS
    sources:
      - App
      - path: Shared
        excludes: ["Photos/**", "Engines/**", "Films/**"]
      - path: Shared/Engines
        type: folder
        buildPhase: resources
      # The AI guides (style, power, burn-in, settings) → Contents/Resources/Guides, read by
      # dotstudio-mcp (read_guide / MCP resources); engines/<id> is served from Resources/Engines.
      - path: Guides
        type: folder
        buildPhase: resources
    dependencies:
      - target: DotStudioSaver
        embed: true
        codeSign: true
        copy:
          destination: resources
      # The MCP server, next to the app's executable (Contents/MacOS): there Bundle.main is
      # the app, so it renders with the app's metallib and resources (MCP/main.swift).
      - target: dotstudio-mcp
        embed: true
        codeSign: true
        copy:
          destination: executables
      - package: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: DotStudio
        LSApplicationCategoryType: "public.app-category.graphics-design"
        # Dual-GPU (Intel) Macs: the app follows automatic graphics switching rather
        # than the legacy rule that pins non-opting apps to the discrete GPU. (The
        # renderers still create the system default device, which is the discrete GPU
        # there; the live wallpaper draws on whichever GPU drives each display.)
        NSSupportsAutomaticGraphicsSwitching: true
        NSHumanReadableCopyright: "DotStudio"
        # Music card: Apple Events to an already-running Spotify / Music (App/Music).
        NSAppleEventsUsageDescription: "DotStudio shows what's playing in Spotify and Music on your screensaver and can play or pause it."
        # Starts as a menu-bar (UIElement) app; AppPresence makes it a regular Dock app
        # before it activates — unless it's a login launch, which stays in the menu bar.
        LSUIElement: true
        # Sparkle auto-update: appcast rides on the latest GitHub release.
        SUFeedURL: "https://github.com/dw2lam/DotStudio/releases/latest/download/appcast.xml"
        SUPublicEDKey: "5cK2ecNcpoVKWQrZc1RgdgBRk2n9Xsa/ygTSWfzEdrE="
        # Check hourly, download silently, install on quit — no prompt on 2nd launch.
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUAllowsAutomaticUpdates: true
        SUScheduledCheckInterval: 3600
        # Sharable preset documents (.dotstudiopreset)
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.davidlam.dotstudio.preset
            UTTypeDescription: DotStudio Screensaver Preset
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [dotstudiopreset]
        CFBundleDocumentTypes:
          - CFBundleTypeName: DotStudio Screensaver Preset
            LSItemContentTypes: [com.davidlam.dotstudio.preset]
            CFBundleTypeRole: Viewer
    settings:
      base:
        PRODUCT_NAME: DotStudio
        PRODUCT_BUNDLE_IDENTIFIER: com.davidlam.DotStudio
        SWIFT_OBJC_BRIDGING_HEADER: Shared/Bridging.h
        ENABLE_APP_SANDBOX: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.5.0"

  # The MCP server AI clients launch (Claude Desktop, Claude Code, Cursor…): stdio JSON-RPC,
  # embedded at DotStudio.app/Contents/MacOS/dotstudio-mcp. Compiles Shared (renderer, model,
  # Shared/AI) — not the shaders: it uses the app's own default.metallib at run time.
  dotstudio-mcp:
    type: tool
    platform: macOS
    sources:
      - MCP
      - path: Shared
        excludes: ["Photos/**", "PlanetTextures/**", "Engines/**", "Films/**", "**/*.metal", "**/*.jpg", "**/*.png"]
    settings:
      base:
        PRODUCT_NAME: dotstudio-mcp
        PRODUCT_BUNDLE_IDENTIFIER: com.davidlam.DotStudio.mcp
        SWIFT_OBJC_BRIDGING_HEADER: Shared/Bridging.h
        ENABLE_APP_SANDBOX: "NO"
        SKIP_INSTALL: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
